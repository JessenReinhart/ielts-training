<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="IELTS Academic training: original practice questions, listening tests and a structured learning centre.">
  <meta name="theme-color" content="#f3efe7">
  <title>IELTS Training — Academic Practice & Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="learn.css">
  <link rel="stylesheet" href="listening.css">
  <link rel="stylesheet" href="react.css">
</head>
<body>
  <div id="app"><div style="padding:40px;font-family:system-ui">Loading IELTS Training…</div></div>

  <script src="content-02.js"></script>

  <script src="content-04.js"></script>

  <script>

      if (!window.React || !window.ReactDOM) {

      }
    });
  </script>
