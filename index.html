<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="IELTS Academic training: original practice questions, listening tests and a structured learning centre.">
  <meta name="theme-color" content="#f3efe7">
  <title>IELTS Training — Academic Practice & Learning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<body>
  <div id="app"><div style="padding:40px;font-family:system-ui">Loading IELTS Training…</div></div>
  <noscript>This practice app requires JavaScript.</noscript>
  <script>
    window.__BOOT_ERROR__ = function (err) {
      var app = document.getElementById('app');
      if (!app) return;
      var msg = err && (err.stack || err.message) ? (err.stack || err.message) : 'Unknown startup error';
      app.innerHTML = '<div style="max-width:720px;margin:10vh auto;padding:32px;font-family:system-ui"><h1>IELTS Training could not start</h1><p>The app hit a startup error. The technical detail below is safe to share for debugging.</p><pre style="white-space:pre-wrap;background:#eee;padding:16px;border-radius:8px">'+String(msg).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</pre><button onclick="location.reload()">Reload</button></div>';
    };
    window.addEventListener('error', function(e){ if(!window.__IELTS_APP_STARTED__) window.__BOOT_ERROR__(e.error || e.message); });
    window.addEventListener('unhandledrejection', function(e){ if(!window.__IELTS_APP_STARTED__) window.__BOOT_ERROR__(e.reason); });
  </script>
  <script src="content-01.js"></script>

  <script src="content-09.js"></script>

  <script src="content-12.js"></script>
  <script src="data-loader.js"></script>
  <script src="listening-data.js"></script>

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="react-app.js"></script>
</body>
</html>
