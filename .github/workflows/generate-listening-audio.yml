name: Generate Listening Audio

on:
  workflow_dispatch:
  push:
    paths:
      - 'listening-part-*.js'
      - 'scripts/generate-free-listening-audio.py'
      - '.github/workflows/generate-listening-audio.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install free offline TTS tools
        run: sudo apt-get update && sudo apt-get install -y espeak ffmpeg

      - name: Generate static listening audio
        run: python3 scripts/generate-free-listening-audio.py

      - name: Commit generated audio
        run: |
          if git diff --quiet -- audio; then
            echo "No audio changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/listening-part-*.mp3
          git commit -m "Add pre-generated IELTS listening audio"
          git push
